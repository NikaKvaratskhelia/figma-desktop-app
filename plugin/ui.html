<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      margin: 0;
      padding: 8px 12px;
      background: #1e1e1e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #737373;
    }
    .dot.connected {
      background: #44ff88;
      box-shadow: 0 0 6px rgba(68, 255, 136, 0.6);
    }
    .dot.connecting {
      background: #ffb700;
    }
    .label {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="status">
    <div id="dot" class="dot connecting"></div>
    <span id="status-label" class="label">Connecting to Gemini Studio...</span>
  </div>

  <script>
    const dot = document.getElementById('dot');
    const label = document.getElementById('status-label');
    let ws = null;

    function connect() {
      label.innerText = 'Connecting to Windows App...';
      dot.className = 'dot connecting';

      try {
        ws = new WebSocket('ws://127.0.0.1:9223');

        ws.onopen = () => {
          label.innerText = 'Connected to Gemini Studio 🟢';
          dot.className = 'dot connected';

          // Send initial document info
          parent.postMessage({ pluginMessage: { type: 'REQUEST_INIT_STATE' } }, '*');
        };

        ws.onmessage = (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.method === 'EXECUTE_CODE') {
              parent.postMessage({
                pluginMessage: {
                  type: 'EXECUTE_CODE',
                  id: message.id,
                  code: message.params.code
                }
              }, '*');
            }
          } catch (e) {
            console.error('Error handling WS message:', e);
          }
        };

        ws.onclose = () => {
          dot.className = 'dot';
          label.innerText = 'Disconnected. Retrying in 2s...';
          setTimeout(connect, 2000);
        };

        ws.onerror = () => {
          ws.close();
        };
      } catch (err) {
        setTimeout(connect, 2000);
      }
    }

    // Listen to messages from plugin worker (code.js)
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    };

    connect();
  </script>
</body>
</html>
